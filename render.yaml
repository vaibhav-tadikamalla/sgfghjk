databases:
  - name: peergriddemo-db
    plan: free
    databaseName: collab
    user: collab

services:
  - type: web
    name: peergriddemo-api
    env: node
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @collab/shared build && pnpm --filter server build && pnpm --filter server db:migrate
    startCommand: node packages/server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: peergriddemo-db
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: ROOM_STORE
        value: memory
      - key: COOKIE_SECRET
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false

  - type: web
    name: peergriddemo-web
    env: static
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @collab/shared build && pnpm --filter client build
    staticPublishPath: packages/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html